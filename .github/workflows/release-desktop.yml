name: Release Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'mac' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - name: Install Linux Build Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools libfuse2

      - name: Setup macOS Keychain for Code Signing
        if: matrix.platform == 'mac'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_SECRET: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          if [ -n "$CSC_LINK" ] && [ -n "$CSC_KEY_PASSWORD" ]; then
            KEYCHAIN_PATH="${RUNNER_TEMP:-/tmp}/build.keychain"
            echo "=== Setting up macOS Keychain: $KEYCHAIN_PATH ==="
            security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1 || true
            security create-keychain -p "$CSC_KEY_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$CSC_KEY_PASSWORD" "$KEYCHAIN_PATH"

            CERT_PATH="${RUNNER_TEMP:-/tmp}/certificate.p12"
            echo "$CSC_LINK" | base64 --decode > "$CERT_PATH"
            security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$CSC_KEY_PASSWORD" "$KEYCHAIN_PATH"

            CURRENT_KEYCHAINS=$(security list-keychains -d user | tr -d '"')
            security list-keychains -d user -s "$KEYCHAIN_PATH" $CURRENT_KEYCHAINS

            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            rm -f "$CERT_PATH"

            echo "CSC_KEYCHAIN=$KEYCHAIN_PATH" >> $GITHUB_ENV
            echo "CSC_NAME=SOFTTY.NET COMPANY LIMITED (79J42YA54H)" >> $GITHUB_ENV
          fi

          if [ -n "$APPLE_API_KEY_SECRET" ] && [ -n "$APPLE_API_KEY_ID" ]; then
            P8_PATH="${RUNNER_TEMP:-/tmp}/AuthKey_${APPLE_API_KEY_ID}.p8"
            echo "$APPLE_API_KEY_SECRET" > "$P8_PATH"
            chmod 600 "$P8_PATH"
            echo "APPLE_API_KEY=$P8_PATH" >> $GITHUB_ENV
          fi

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build All Workspaces
        run: pnpm run build:all

      - name: Build Native xlsx-engine Sidecar (macOS Universal)
        if: matrix.platform == 'mac'
        run: pnpm --filter @softty/sheets run native:build:universal

      - name: Build Native xlsx-engine Sidecar (Windows / Linux)
        if: matrix.platform != 'mac'
        run: pnpm --filter @softty/sheets run native:build

      - name: Package Desktop Installer (${{ matrix.platform }})
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GENOFFICE_UPDATE_URL: ${{ secrets.GENOFFICE_UPDATE_URL }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || '79J42YA54H' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ "${{ matrix.platform }}" = "mac" ]; then
            pnpm run dist:mac
          elif [ "${{ matrix.platform }}" = "win" ]; then
            pnpm run dist:win
          elif [ "${{ matrix.platform }}" = "linux" ]; then
            pnpm run dist:linux
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: softty-office-${{ matrix.platform }}
          path: |
            apps/shell/release/*.dmg
            apps/shell/release/*.zip
            apps/shell/release/*.exe
            apps/shell/release/*.AppImage
            apps/shell/release/*.deb
            apps/shell/release/*.yml
          if-no-files-found: warn

      - name: Release to GitHub
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: |
            apps/shell/release/*.dmg
            apps/shell/release/*.zip
            apps/shell/release/*.exe
            apps/shell/release/*.AppImage
            apps/shell/release/*.deb
            apps/shell/release/*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
